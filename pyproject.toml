

[tool.poetry]
name = "elysian-lex-engine"
version = "0.1.0"
description = "Motor Cognitivo do Elysian Lex (Soberania Local)"
authors = ["Aurora AI"]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
fastapi = "^0.110.0"
uvicorn = "^0.29.0"
